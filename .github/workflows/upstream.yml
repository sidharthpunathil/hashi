name: Upstream

# Once a week, compare each agent CLI's latest release with the version in
# docs/research/verified-versions.json and open or update one `upstream`
# issue per agent that is newer. A newer release never fails this workflow;
# only a failed lookup does. Cursor's installer is fetched as text and
# searched, never run.
on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: upstream
  cancel-in-progress: false

jobs:
  check:
    name: check upstream releases
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the check script
        run: sh scripts/test-upstream-check.sh
      - name: Check releases and report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: sh scripts/upstream-check.sh check --report
