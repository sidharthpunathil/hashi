[package]
name = "hashi"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
description = "Call Claude Code, Codex and other coding-agent CLIs on your machine over an authenticated HTTP API, with a live terminal dashboard."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/sidharthpunathil/hashi"
homepage = "https://github.com/sidharthpunathil/hashi"
keywords = ["claude", "codex", "ai", "api", "tui"]
categories = ["command-line-utilities", "web-programming::http-server"]
exclude = [".github/", ".claude/", ".agents/", "skills-lock.json"]

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
crossterm = { version = "0.29.0", features = ["event-stream", "osc52"] }
dirs = "7.0.0"
futures = "0.3.34"
hex = "0.4.3"
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["server", "server-graceful", "http1", "service", "tokio"] }
rand = "0.10.3"
ratatui = "0.30.2"
rusqlite = { version = "0.41.1", features = ["bundled"] }
rustls-pki-types = { version = "1.15.1", features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sysinfo = { version = "0.38.4", default-features = false, features = ["system", "disk"] }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "macros"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-util = "0.7.20"
tower-service = "0.3.3"
tower-http = { version = "0.7.1", features = ["limit", "cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }
ureq = { version = "3.5.1", default-features = false, features = ["rustls", "json"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", default-features = false, features = ["signal", "process", "resource"] }

[target.'cfg(windows)'.dependencies]
self-replace = "1.5.1"
win32job = "2.0.3"

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"
todo = "warn"
redundant_clone = "warn"
needless_collect = "warn"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
